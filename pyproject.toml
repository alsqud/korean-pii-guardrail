[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "korean-pii-guardrail"
version = "0.3.0rc2"
description = "Hybrid Korean PII detection and masking for product integration"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.13.0,<2.14",
  "transformers==5.17.0",
  "safetensors==0.8.0",
  "numpy==2.2.6",
  "ko-pii==1.16.0",
  "presidio-analyzer==2.2.364",
  "kiwipiepy==0.24.0",
]
[project.scripts]
korean-pii = "korean_pii.cli:main"
korean-pii-build-address-index = "korean_pii.address_index_builder:main"
korean-pii-health = "korean_pii.health:main"
korean-pii-model-check = "korean_pii.model_check:main"
[tool.setuptools.packages.find]
where = ["source"]
[tool.setuptools.package-data]
korean_pii = ["default-policy.json", "model-manifest.json"]
