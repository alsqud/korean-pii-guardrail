<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PII Guardrail + Gemini</title>
  <style>
    :root { color-scheme: light; --ink:#17222b; --muted:#66747f; --line:#dce4e8; --accent:#126b58; --soft:#edf7f4; --error:#9d2d2d; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#f5f7f6; color:var(--ink); font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; }
    main { width:min(920px, calc(100% - 32px)); margin:48px auto; }
    header { margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:clamp(28px,5vw,42px); letter-spacing:-.04em; }
    .lead { margin:0; color:var(--muted); line-height:1.7; }
    .status { display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:white; font-size:14px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#aab3b9; }
    .status.ready .dot { background:#1d9b71; box-shadow:0 0 0 4px #dff4ec; }
    .status.error .dot { background:#d05757; box-shadow:0 0 0 4px #fae7e7; }
    .card { background:white; border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 10px 30px rgba(26,47,58,.06); margin-top:16px; }
    label, h2 { display:block; margin:0 0 10px; font-weight:750; font-size:16px; }
    textarea { width:100%; min-height:180px; resize:vertical; border:1px solid #bdc9cf; border-radius:12px; padding:15px; font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink); }
    textarea:focus { outline:3px solid #d9eee8; border-color:var(--accent); }
    .actions { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:14px; }
    .hint { color:var(--muted); font-size:13px; line-height:1.5; }
    button { border:0; border-radius:11px; padding:11px 18px; background:var(--accent); color:white; font-weight:750; cursor:pointer; white-space:nowrap; }
    button:disabled { opacity:.5; cursor:wait; }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    .output { white-space:pre-wrap; line-height:1.7; overflow-wrap:anywhere; }
    .masked { padding:14px; background:var(--soft); border-radius:11px; font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { padding:6px 9px; border-radius:8px; background:#edf1f3; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .hidden { display:none; }
    .error-text { color:var(--error); }
    footer { margin:20px 4px 0; color:var(--muted); font-size:12px; line-height:1.6; }
    @media (max-width:720px) { main{margin:24px auto}.grid{grid-template-columns:1fr}.actions{align-items:flex-end}.card{padding:17px} }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PII Guardrail + Gemini</h1>
      <p class="lead">원문은 이 Python 서버에서 먼저 마스킹되고, 아래에 표시되는 마스킹 결과만 Gemini로 전송됩니다.</p>
      <div id="status" class="status"><span class="dot"></span><span id="statusText">준비 상태 확인 중…</span></div>
    </header>

    <section class="card">
      <form id="chatForm">
        <label for="inputText">Gemini에게 보낼 내용</label>
        <textarea id="inputText" maxlength="100000" required>아래 배송 문의를 정리해줘.
개인 담당자: 김민수
연락처: 010-2345-6789
주소: 서울특별시 종로구 세종대로 1 101동 202호
배송 전 문 앞에 놓아주세요.</textarea>
        <div class="actions">
          <span class="hint">예시는 합성 정보입니다. 실제 개인정보로 시험하지 마세요.</span>
          <button id="submitButton" type="submit" disabled>마스킹 후 질문</button>
        </div>
      </form>
      <p id="error" class="error-text hidden" role="alert"></p>
    </section>

    <section id="results" class="grid hidden" aria-live="polite">
      <article class="card">
        <h2>Gemini 답변</h2>
        <div id="answer" class="output"></div>
      </article>
      <article class="card">
        <h2>Gemini에 실제 전송된 문장</h2>
        <div id="maskedText" class="masked"></div>
        <h2 style="margin-top:18px">탐지 요약</h2>
        <div id="detections" class="chips"></div>
      </article>
    </section>

    <footer>이 예제는 로컬 검증용입니다. 외부 공개 전에는 인증, TLS, 요청 제한과 운영 로그의 개인정보 정책을 별도로 적용하세요.</footer>
  </main>

  <script>
    const statusBox = document.querySelector('#status');
    const statusText = document.querySelector('#statusText');
    const form = document.querySelector('#chatForm');
    const button = document.querySelector('#submitButton');
    const errorBox = document.querySelector('#error');
    const results = document.querySelector('#results');

    async function checkHealth() {
      try {
        const response = await fetch('/api/health');
        const health = await response.json();
        if (health.status === 'ready') {
          statusBox.classList.add('ready');
          statusText.textContent = `준비됨 · ${health.gemini_model}`;
          button.disabled = false;
          return;
        }
        statusBox.classList.add('error');
        const missing = [];
        if (!health.pii_ready) missing.push('PII 모델/주소 인덱스');
        if (!health.gemini_configured) missing.push('Gemini API 키');
        statusText.textContent = `설정 필요: ${missing.join(', ')}`;
      } catch (_) {
        statusBox.classList.add('error');
        statusText.textContent = '서버 상태를 확인할 수 없습니다.';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = '처리 중…';
      errorBox.classList.add('hidden');
      results.classList.add('hidden');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text: document.querySelector('#inputText').value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '요청에 실패했습니다.');

        document.querySelector('#answer').textContent = data.answer;
        document.querySelector('#maskedText').textContent = data.masked_text;
        const chips = document.querySelector('#detections');
        chips.replaceChildren();
        if (data.detections.length === 0) {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = '탐지 없음';
          chips.append(chip);
        } else {
          data.detections.forEach((item) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = `${item.label} × ${item.count}`;
            chips.append(chip);
          });
        }
        results.classList.remove('hidden');
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.remove('hidden');
      } finally {
        button.disabled = false;
        button.textContent = '마스킹 후 질문';
      }
    });

    checkHealth();
  </script>
</body>
</html>
